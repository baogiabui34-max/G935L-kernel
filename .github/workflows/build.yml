name: Inspect G935L Kernel DVFS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-22.04

    steps:
      - name: Clone kernel source
        run: |
          git clone --depth=1 \
            https://github.com/8890q/android_kernel_samsung_universal8890.git \
            kernel

      - name: Locate DVFS tables and PLL definitions
        working-directory: kernel
        run: |
          set -o pipefail

          echo "========================================"
          echo "=== DFS TABLE DEFINITIONS ==="
          echo "========================================"

          grep -RniE \
            'dfsbig_table|dfslittle_table|dfsg3d_table|dfsg3dm_table' \
            drivers/soc/samsung/pwrcal \
            2>/dev/null || true

          echo
          echo "========================================"
          echo "=== RATE TABLE CREATION ==="
          echo "========================================"

          grep -RniE \
            'dfs_get_rate_table|rate_table.*=|=.*rate_table|set_rate_table|init.*rate.*table' \
            drivers/soc/samsung/pwrcal \
            drivers/cpufreq \
            2>/dev/null \
            | head -n 1000 || true

          echo
          echo "========================================"
          echo "=== FREQUENCY / VOLTAGE DATA ==="
          echo "========================================"

          grep -RniE \
            'freq_table|frequency_table|volt_table|voltage_table|volt.*table|freq.*table' \
            drivers/soc/samsung/pwrcal/S5E8890 \
            drivers/cpufreq \
            2>/dev/null \
            | head -n 1500 || true

          echo
          echo "========================================"
          echo "=== MNGS PLL ==="
          echo "========================================"

          grep -RniE \
            'MNGS_PLL|mngs.*pll|pll.*mngs' \
            drivers/soc/samsung/pwrcal/S5E8890 \
            2>/dev/null \
            | head -n 1000 || true

          echo
          echo "========================================"
          echo "=== APOLLO PLL ==="
          echo "========================================"

          grep -RniE \
            'APOLLO_PLL|apollo.*pll|pll.*apollo' \
            drivers/soc/samsung/pwrcal/S5E8890 \
            2>/dev/null \
            | head -n 1000 || true

          echo
          echo "========================================"
          echo "=== G3D PLL ==="
          echo "========================================"

          grep -RniE \
            'G3D_PLL|g3d.*pll|pll.*g3d' \
            drivers/soc/samsung/pwrcal/S5E8890 \
            2>/dev/null \
            | head -n 1000 || true

      - name: Inspect S5E8890 DFS source context
        working-directory: kernel
        run: |
          echo "========================================"
          echo "=== S5E8890-dfs.c: CPU/GPU TABLE AREA ==="
          echo "========================================"

          sed -n '450,610p' \
            drivers/soc/samsung/pwrcal/S5E8890/S5E8890-dfs.c

          echo
          echo "========================================"
          echo "=== S5E8890 PLL SOURCE ==="
          echo "========================================"

          sed -n '1,500p' \
            drivers/soc/samsung/pwrcal/S5E8890/S5E8890-pll.c \
            | head -n 500

      - name: Inspect CPU frequency calibration
        working-directory: kernel
        run: |
          echo "========================================"
          echo "=== EXYNOS MP CPUFREQ CAL ==="
          echo "========================================"

          grep -nEi \
            'CL_ZERO|CL_ONE|dfsbig|dfslittle|freq_table|volt_table|dfs_get|frequency|voltage|rate' \
            drivers/cpufreq/exynos-mp-cpufreq-cal.c \
            2>/dev/null \
            | head -n 1500 || true

          echo
          echo "========================================"
          echo "=== CPUFREQ MAIN DRIVER ==="
          echo "========================================"

          grep -nEi \
            'CL_ZERO|CL_ONE|dfsbig|dfslittle|freq_table|volt_table|frequency|voltage|rate' \
            drivers/cpufreq/exynos-mp-cpufreq.c \
            2>/dev/null \
            | head -n 1500 || true

      - name: Find all S5E8890 frequency constants
        working-directory: kernel
        run: |
          echo "========================================"
          echo "=== POSSIBLE CPU/GPU FREQUENCY CONSTANTS ==="
          echo "========================================"

          grep -RniE \
            '\b(1900000|2000000|2200000|2400000|2500000|2600000|2700000|2800000|800000|806000|850000|900000|912000)\b' \
            drivers/soc/samsung/pwrcal/S5E8890 \
            drivers/cpufreq \
            drivers/gpu \
            2>/dev/null \
            | head -n 1500 || true

      - name: Save inspection report
        if: always()
        working-directory: kernel
        run: |
          {
            echo "=== Git commit ==="
            git log -1 --oneline
            echo
            echo "=== Source tree ==="
            find drivers/soc/samsung/pwrcal/S5E8890 -maxdepth 1 -type f -print
          } > ../inspection-summary.txt

      - name: Upload inspection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exynos8890-dvfs-inspection
          path: inspection-summary.txt
          if-no-files-found: ignore
