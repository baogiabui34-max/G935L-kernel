name: Inspect G935L Kernel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-22.04

    steps:
      - name: Clone kernel source
        run: |
          git clone --depth=1 \
            https://github.com/8890q/android_kernel_samsung_universal8890.git \
            kernel

      - name: Inspect S5E8890 CPU DFS
        working-directory: kernel
        run: |
          echo "========================================"
          echo "=== S5E8890 DFS CPU REFERENCES ==="
          echo "========================================"

          grep -nEi \
            'cpu|cl0|cl1|cluster|big|little|freq|frequency|rate|volt|voltage|dfs|pll|cpucl0|cpucl1' \
            drivers/soc/samsung/pwrcal/S5E8890/S5E8890-dfs.c \
            | head -n 1000 || true

          echo
          echo "========================================"
          echo "=== EXYNOS CPUFREQ CALIBRATION ==="
          echo "========================================"

          grep -nEi \
            'CL_ZERO|CL_ONE|freq_table|volt_table|frequency|voltage|cpu|cluster|cal|dfs' \
            drivers/cpufreq/exynos-mp-cpufreq-cal.c \
            | head -n 1000 || true

          echo
          echo "========================================"
          echo "=== CPUFREQ MAIN DRIVER ==="
          echo "========================================"

          grep -nEi \
            'CL_ZERO|CL_ONE|freq_table|volt_table|frequency|cpu|cluster|cal' \
            drivers/cpufreq/exynos-mp-cpufreq.c \
            | head -n 1000 || true

          echo
          echo "========================================"
          echo "=== S5E8890 PLL ==="
          echo "========================================"

          grep -nEi \
            'cpu|cl0|cl1|cluster|freq|frequency|rate|pll|div' \
            drivers/soc/samsung/pwrcal/S5E8890/S5E8890-pll.c \
            | head -n 1000 || true

          echo
          echo "========================================"
          echo "=== S5E8890 VCLK ==="
          echo "========================================"

          grep -nEi \
            'cpu|cl0|cl1|cluster|freq|frequency|rate|pll|div' \
            drivers/soc/samsung/pwrcal/S5E8890/S5E8890-vclk.c \
            | head -n 1000 || true
