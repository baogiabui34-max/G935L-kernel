name: Inspect G935L CPU DVFS Levels

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-22.04

    steps:
      - name: Clone kernel source
        run: |
          git clone --depth=1 \
            https://github.com/8890q/android_kernel_samsung_universal8890.git \
            kernel

      - name: Find DVFS level definitions
        working-directory: kernel
        run: |
          echo "========================================"
          echo "=== ECT DVFS STRUCTURES ==="
          echo "========================================"

          grep -RniE \
            'struct.*dvfs|list_level|main_frequencies|frequency|voltage' \
            drivers/soc/samsung \
            drivers/cpufreq \
            include \
            2>/dev/null \
            | grep -Ei 'ect|dvfs|8890|exynos' \
            | head -n 2000 || true

          echo
          echo "========================================"
          echo "=== CL0 / LITTLE DVFS TABLE ==="
          echo "========================================"

          grep -RniE \
            'cl0_dvfs_table|CL_ZERO|dvfs_little|little' \
            . \
            --exclude-dir=.git \
            2>/dev/null \
            | head -n 1500 || true

          echo
          echo "========================================"
          echo "=== CL1 / BIG DVFS TABLE ==="
          echo "========================================"

          grep -RniE \
            'cl1_dvfs_table|CL_ONE|dvfs_big|big' \
            . \
            --exclude-dir=.git \
            2>/dev/null \
            | head -n 1500 || true

          echo
          echo "========================================"
          echo "=== MAIN FREQUENCY / VOLTAGE ENTRIES ==="
          echo "========================================"

          grep -RniE \
            'main_frequencies|frequency.*voltage|voltage.*frequency|freq.*volt' \
            drivers/soc/samsung \
            drivers/cpufreq \
            2>/dev/null \
            | head -n 2000 || true

      - name: Inspect ECT parser
        working-directory: kernel
        run: |
          echo "========================================"
          echo "=== ECT DVFS PARSER ==="
          echo "========================================"

          find . -type f \
            \( -iname '*ect*' -o -iname '*dvfs*' \) \
            -print \
            | head -n 500

          echo
          echo "=== ECT DOMAIN ACCESS ==="

          grep -RniE \
            'ect_dvfs_get_domain|ect_get_block|BLOCK_DVFS|list_level' \
            drivers \
            include \
            2>/dev/null \
            | head -n 2000 || true

      - name: Inspect device tree CPU tables
        working-directory: kernel
        run: |
          echo "========================================"
          echo "=== DEVICE TREE DVFS TABLES ==="
          echo "========================================"

          find arch/arm64/boot/dts -type f \
            \( -iname '*8890*' -o -iname '*hero2lte*' -o -iname '*exynos*' \) \
            -print \
            | head -n 500

          echo
          echo "=== cl0_dvfs_table / cl1_dvfs_table ==="

          grep -RniE \
            'cl0_dvfs_table|cl1_dvfs_table|cpufreq_dvfs_table' \
            arch/arm64/boot/dts \
            2>/dev/null \
            | head -n 1500 || true

      - name: Inspect actual S5E8890 DVFS domain registration
        working-directory: kernel
        run: |
          echo "========================================"
          echo "=== S5E8890 DVFS DOMAIN REGISTRATION ==="
          echo "========================================"

          grep -RniE \
            'dvfs_big|dvfs_little|dvfs_g3d|dvfs_domain|list_level|num_of_lv' \
            drivers/soc/samsung/pwrcal/S5E8890 \
            drivers/soc/samsung/pwrcal \
            2>/dev/null \
            | head -n 2500 || true

      - name: Inspect all likely clock levels
        working-directory: kernel
        run: |
          echo "========================================"
          echo "=== LIKELY CPU CLOCK LEVELS ==="
          echo "========================================"

          grep -RniE \
            '\b(800000|900000|1000000|1100000|1200000|1300000|1400000|1500000|1600000|1700000|1800000|1900000|2000000|2100000|2200000|2300000|2400000|2500000|2600000|2700000|2800000)\b' \
            drivers/soc/samsung/pwrcal/S5E8890 \
            drivers/cpufreq \
            arch/arm64/boot/dts \
            2>/dev/null \
            | head -n 2500 || true

          echo
          echo "========================================"
          echo "=== LIKELY GPU CLOCK LEVELS ==="
          echo "========================================"

          grep -RniE \
            '\b(700000|750000|800000|806000|850000|900000|912000|950000|1000000)\b' \
            drivers/soc/samsung/pwrcal/S5E8890 \
            drivers/gpu \
            arch/arm64/boot/dts \
            2>/dev/null \
            | head -n 2500 || true
