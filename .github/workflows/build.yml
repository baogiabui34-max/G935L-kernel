      - name: Find CPU GPU frequency code
        working-directory: kernel
        run: |
          echo "=== CPU frequency files ==="
          grep -RniE "2600000|1600000|cpu.*freq|freq.*cpu|dvfs" \
            drivers arch/arm64 2>/dev/null | head -n 200 || true

          echo
          echo "=== GPU / Mali files ==="
          find drivers/gpu -type f \
            \( -iname '*mali*' -o -iname '*dvfs*' -o -iname '*gpu*' \) \
            -print | head -n 200

          echo
          echo "=== 800/806/900+ MHz references ==="
          grep -RniE "806000|800000|900000|912000|912" \
            drivers/gpu arch/arm64 2>/dev/null | head -n 200 || true
