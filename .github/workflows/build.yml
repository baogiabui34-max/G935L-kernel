name: Inspect CPU Max Limits

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-22.04

    steps:
      - name: Clone kernel
        run: |
          git clone --depth=1 \
            https://github.com/8890q/android_kernel_samsung_universal8890.git \
            kernel

      - name: Find CPU frequency limits
        working-directory: kernel
        run: |
          echo "========================================"
          echo "CPU MAX FREQUENCY LIMITS"
          echo "========================================"

          grep -RniE \
            "1976000|1898000|3000000|2800000|cpu_max|cpu_min|max_freq|min_freq|scaling_max_freq" \
            drivers/cpufreq \
            drivers/soc/samsung \
            arch/arm64/boot/dts \
            2>/dev/null | head -n 1000

      - name: Find DVFS domain usage
        working-directory: kernel
        run: |
          echo "========================================"
          echo "DVFS DOMAIN USAGE"
          echo "========================================"

          grep -RniE \
            "dvfs_little|dvfs_big|CL_ZERO|CL_ONE|cl0_dvfs_table|cl1_dvfs_table" \
            drivers/cpufreq \
            drivers/soc/samsung \
            2>/dev/null | head -n 1000

      - name: Find frequency table creation
        working-directory: kernel
        run: |
          echo "========================================"
          echo "FREQUENCY TABLE CREATION"
          echo "========================================"

          grep -RniE \
            "freq_table|frequency_table|dfs_get_rate_table|dfs_set_clk_information|list_level" \
            drivers/cpufreq \
            drivers/soc/samsung \
            2>/dev/null | head -n 1000

      - name: Find boot frequency
        working-directory: kernel
        run: |
          echo "========================================"
          echo "BOOT / START FREQUENCY"
          echo "========================================"

          grep -RniE \
            "boot_freq|start_freq|initial_freq|policy->max|policy->min" \
            drivers/cpufreq \
            arch/arm64/boot/dts \
            2>/dev/null | head -n 500
