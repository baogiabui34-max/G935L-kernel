name: Inspect CPU GPU DVFS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-22.04

    steps:
      - name: Clone kernel source
        run: |
          git clone --depth=1 \
            https://github.com/8890q/android_kernel_samsung_universal8890.git \
            kernel

      - name: Dump CPU DVFS tables
        working-directory: kernel
        run: |
          echo "========================================"
          echo "=== EXYNOS8890 CPU DVFS TABLES ==="
          echo "========================================"

          sed -n '475,525p' arch/arm64/boot/dts/exynos8890.dtsi

      - name: Find GPU DVFS definitions
        working-directory: kernel
        run: |
          echo
          echo "========================================"
          echo "=== GPU / G3D DVFS REFERENCES ==="
          echo "========================================"

          grep -RniE \
            'g3d|gpu|mali|3d_dvfs|dvfs.*3d|g3d_dvfs|mali_dvfs' \
            arch/arm64/boot/dts \
            drivers \
            --include='*.dts' \
            --include='*.dtsi' \
            --include='*.c' \
            --include='*.h' \
            | head -n 250

      - name: Find DVFS table symbols
        working-directory: kernel
        run: |
          echo
          echo "========================================"
          echo "=== DVFS TABLE SYMBOLS ==="
          echo "========================================"

          grep -RniE \
            'dfsbig_table|dfslittle_table|dfsg3d_table|cl0_dvfs_table|cl1_dvfs_table|g3d_dvfs_table' \
            . \
            --include='*.c' \
            --include='*.h' \
            --include='*.dts' \
            --include='*.dtsi' \
            | head -n 250

      - name: Find 912 MHz related values
        working-directory: kernel
        run: |
          echo
          echo "========================================"
          echo "=== POSSIBLE GPU FREQUENCIES ==="
          echo "========================================"

          grep -RniE \
            '912000|900000|897000|880000|806000|800000|MHz|khz' \
            drivers/gpu \
            drivers/soc/samsung/pwrcal \
            arch/arm64/boot/dts \
            --include='*.c' \
            --include='*.h' \
            --include='*.dts' \
            --include='*.dtsi' \
            | head -n 300
