name: Build G935L Kernel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git make bc bison flex \
            build-essential gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            libssl-dev libelf-dev \
            python3 cpio rsync

      - name: Clone kernel source
        run: |
          git clone --depth=1 \
            https://github.com/8890q/android_kernel_samsung_universal8890.git \
            kernel

      - name: Check source
        working-directory: kernel
        run: |
          echo "=== Kernel source ==="
          git log -1 --oneline

          echo
          echo "=== Available hero2lte defconfigs ==="
          find . -iname '*hero2lte*defconfig' -print

      - name: Find Exynos 8890 DVFS tables
        working-directory: kernel
        run: |
          echo "=== CPUFREQ ==="

          find drivers arch -type f \
            \( -iname '*cpufreq*' -o -iname '*8890*' -o -iname '*exynos*' \) \
            -print \
            | grep -Ei 'cpufreq|8890|exynos' \
            | head -n 300

          echo
          echo "=== CPU frequency tables ==="

          grep -RniE \
            'cpufreq_frequency_table|freq_table|frequency_table|2600000|2700000|2800000' \
            drivers/cpufreq arch/arm64/mach-exynos \
            2>/dev/null \
            | grep -Ei '8890|exynos|midas|arm|cpu' \
            | head -n 300 || true

          echo
          echo "=== MALI T880 ==="

          find drivers/gpu -type f \
            | grep -Ei 'mali|exynos|8890' \
            | head -n 300

          echo
          echo "=== MALI DVFS / clocks ==="

          grep -RniE \
            'mali.*freq|freq.*mali|dvfs|806000|800000|900000|912000' \
            drivers/gpu \
            2>/dev/null \
            | head -n 300 || true

      - name: Build kernel
        working-directory: kernel
        run: |
          set -o pipefail

          echo "=== Configure kernel ==="

          make ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            exynos8890-hero2lte_defconfig

          echo
          echo "=== Build kernel ==="

          make -j2 \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            2>&1 | tee ../build.log

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-logs
          path: build.log
          if-no-files-found: ignore

      - name: Upload kernel output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: G935L-kernel-output
          path: |
            kernel/arch/arm64/boot/Image
            kernel/arch/arm64/boot/Image.gz
            kernel/arch/arm64/boot/dts/**/*.dtb
          if-no-files-found: warn
