name: Inspect G935L GPU PLL

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-22.04

    steps:
      - name: Clone kernel source
        run: |
          git clone --depth=1 \
            https://github.com/8890q/android_kernel_samsung_universal8890.git \
            kernel

      - name: Inspect G3D DFS
        working-directory: kernel
        run: |
          echo "========================================"
          echo "G3D DFS"
          echo "========================================"

          grep -RniE \
            "dfsg3d_table|dvfs_g3d|G3D_PLL|G3D" \
            drivers/soc/samsung/pwrcal/S5E8890 \
            2>/dev/null | head -n 500

      - name: Print DFS source
        working-directory: kernel
        run: |
          echo "========================================"
          echo "S5E8890-dfs.c"
          echo "========================================"

          sed -n '1,700p' \
            drivers/soc/samsung/pwrcal/S5E8890/S5E8890-dfs.c

      - name: Inspect PLL source
        working-directory: kernel
        run: |
          echo "========================================"
          echo "G3D PLL REFERENCES"
          echo "========================================"

          grep -n -B 40 -A 120 \
            -E "G3D_PLL|g3d" \
            drivers/soc/samsung/pwrcal/S5E8890/S5E8890-pll.c \
            2>/dev/null || true

      - name: Inspect PLL headers
        working-directory: kernel
        run: |
          echo "========================================"
          echo "PLL HEADERS"
          echo "========================================"

          grep -RniE \
            "G3D_PLL|PLL_G3D|g3d_pll" \
            drivers/soc/samsung/pwrcal/S5E8890 \
            2>/dev/null | head -n 500

      - name: Inspect CAL rate functions
        working-directory: kernel
        run: |
          echo "========================================"
          echo "CAL RATE FUNCTIONS"
          echo "========================================"

          grep -RniE \
            "dfs_set_rate|dfs_get_rate|set_rate.*dvfs|rate_table" \
            drivers/soc/samsung/pwrcal \
            2>/dev/null | head -n 500

      - name: Inspect GPU clock calls
        working-directory: kernel
        run: |
          echo "========================================"
          echo "GPU CLOCK CALLS"
          echo "========================================"

          grep -RniE \
            "cal_dfs_set_rate|cal_dfs_get_rate|dvfs_g3d|GPU_MAX_CLOCK" \
            drivers/gpu \
            2>/dev/null | head -n 500

      - name: Search all 8890 frequency values
        working-directory: kernel
        run: |
          echo "========================================"
          echo "HIGH GPU CLOCK SEARCH"
          echo "========================================"

          grep -RniE \
            "702|728|754|806|850|875|900|912|925|950|1000" \
            drivers/soc/samsung/pwrcal/S5E8890 \
            drivers/gpu/arm/t8xx \
            arch/arm64/boot/dts \
            2>/dev/null | head -n 1000

      - name: Search old Samsung 8890 sources
        working-directory: kernel
        run: |
          echo "========================================"
          echo "ALL GPU DVFS TABLES"
          echo "========================================"

          grep -RniE \
            "\{(702|728|754|806)," \
            drivers \
            2>/dev/null | head -n 300

      - name: Save relevant files
        working-directory: kernel
        run: |
          mkdir -p ../gpu-inspect

          cp \
            drivers/soc/samsung/pwrcal/S5E8890/S5E8890-dfs.c \
            ../gpu-inspect/S5E8890-dfs.c

          cp \
            drivers/soc/samsung/pwrcal/S5E8890/S5E8890-pll.c \
            ../gpu-inspect/S5E8890-pll.c

          cp \
            drivers/soc/samsung/pwrcal/S5E8890/S5E8890-vclk.c \
            ../gpu-inspect/S5E8890-vclk.c

          cp \
            drivers/soc/samsung/pwrcal/S5E8890/S5E8890-vclk.h \
            ../gpu-inspect/S5E8890-vclk.h

      - name: Upload inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: G935L-GPU-PLL-inspection
          path: gpu-inspect/
          if-no-files-found: warn
